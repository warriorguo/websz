name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          VERSION=${{ github.ref_name }}
          LDFLAGS="-X github.com/warriorguo/websz/internal/updater.Version=${VERSION}"
          mkdir -p dist
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/websz-darwin-amd64      ./cmd/websz
          GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/websz-darwin-arm64      ./cmd/websz
          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/websz-linux-amd64       ./cmd/websz
          GOOS=linux   GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/websz-linux-arm64       ./cmd/websz
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/websz-windows-amd64.exe ./cmd/websz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
